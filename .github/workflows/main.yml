name: Deploy id-api prod
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

jobs:
  tests:
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HOST_AIDN: ${{ secrets.HOST_AIDN }}
      MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DNS }}
      SUPER_SECRET: ${{ secrets.SUPER_SECRET }}
      SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
    runs-on: buildjet-4vcpu-ubuntu-2204
    environment: kreative-id-api
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn install
      - run: yarn prisma generate
      - run: NODE_ENV=development yarn lint
      - run: NODE_ENV=development yarn build
      - run: NODE_ENV=development yarn test
  build:
    needs: tests
    runs-on: buildjet-4vcpu-ubuntu-2204
    environment: kreative-id-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          check-latest: true
      - name: Install Railway
        run: npm i -g @railway/cli
      - name: Deploy
        run: railway up --service id-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
